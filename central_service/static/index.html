<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetometer Network Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        main {
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex: 1;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        /* Node Selector List */
        .node-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 450px;
            overflow-y: auto;
        }

        .node-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .node-card:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .node-card.selected {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.12);
        }

        .node-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .node-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .node-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .node-metrics {
            display: flex;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .metric-val {
            color: var(--text-main);
            font-weight: 500;
        }

        /* Chart Area */
        .chart-container {
            position: relative;
            height: 380px;
            width: 100%;
        }

        .chart-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        select, input, button {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        button {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Download Section */
        .download-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <div class="logo-icon">M</div>
            <h1>Magnetometer Regional Network</h1>
        </div>
        <div class="status-badge" id="net-status">
            <div class="pulse-dot"></div>
            <span id="status-text">Connected Live</span>
        </div>
    </header>

    <main>
        <div class="dashboard-grid">
            <!-- Left Side: Node List -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Active Nodes</span>
                    <span id="node-count" style="font-size: 0.8rem; color: var(--text-muted);">0 nodes</span>
                </div>
                <div class="node-list" id="node-list">
                    <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 2rem 0;">
                        Waiting for incoming nodes...
                    </div>
                </div>
            </div>

            <!-- Right Side: Live Timeseries Chart -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title" id="selected-node-title">Real-Time Telemetry</span>
                    <div class="chart-controls">
                        <select id="field-selector" onchange="updateChartSeries()">
                            <option value="all">3-Axis Vectors (X, Y, Z)</option>
                            <option value="mag">Total Magnitude (|B|)</option>
                            <option value="x">X Axis Only</option>
                            <option value="y">Y Axis Only</option>
                            <option value="z">Z Axis Only</option>
                        </select>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="realtimeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Bottom Panel: Export / Download Data Subset -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Data Subset Exporter</span>
            </div>
            <div class="download-panel">
                <div class="form-group">
                    <label>Node ID</label>
                    <select id="export-node-id"></select>
                </div>
                <div class="form-group">
                    <label>Format</label>
                    <select id="export-format">
                        <option value="csv">CSV File (.csv)</option>
                        <option value="npz">NumPy Compressed (.npz)</option>
                        <option value="json">JSON</option>
                    </select>
                </div>
                <div class="form-group" style="align-self: flex-end;">
                    <button onclick="downloadDataSubset()">Download Subset</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let nodesData = {};
        let selectedNodeId = null;
        let chart = null;
        const maxDataPoints = 60; // Keep last 60 points in chart

        // Time series storage per node: { nodeId: [{time, x, y, z, mag}, ...] }
        let timeSeriesStore = {};

        function initChart() {
            const ctx = document.getElementById('realtimeChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Bx (nT)', borderColor: '#38bdf8', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                        { label: 'By (nT)', borderColor: '#a855f7', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                        { label: 'Bz (nT)', borderColor: '#22c55e', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                        { label: 'Magnitude (nT)', borderColor: '#ef4444', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [], hidden: true }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#f8fafc', font: { family: 'Inter', size: 11 } }
                        }
                    }
                }
            });
        }

        function updateChartSeries() {
            const mode = document.getElementById('field-selector').value;
            chart.data.datasets[0].hidden = (mode !== 'all' && mode !== 'x');
            chart.data.datasets[1].hidden = (mode !== 'all' && mode !== 'y');
            chart.data.datasets[2].hidden = (mode !== 'all' && mode !== 'z');
            chart.data.datasets[3].hidden = (mode !== 'mag');
            chart.update();
        }

        function renderNodeList() {
            const listEl = document.getElementById('node-list');
            const selectEl = document.getElementById('export-node-id');
            const nodes = Object.values(nodesData);
            
            document.getElementById('node-count').innerText = `${nodes.length} nodes registered`;
            
            if (nodes.length === 0) return;

            let listHtml = '';
            let optionsHtml = '<option value="">All Nodes</option>';

            nodes.forEach(n => {
                const isSel = n.node_id === selectedNodeId ? 'selected' : '';
                const mag = Math.sqrt(n.x*n.x + n.y*n.y + n.z*n.z).toFixed(1);
                const timeStr = n.last_seen ? new Date(n.last_seen).toLocaleTimeString() : 'N/A';

                listHtml += `
                    <div class="node-card ${isSel}" onclick="selectNode('${n.node_id}')">
                        <div class="node-card-top">
                            <span class="node-name">${n.node_id}</span>
                            <span class="node-time">${timeStr}</span>
                        </div>
                        <div class="node-metrics">
                            <span>B: <span class="metric-val">${mag} nT</span></span>
                            <span>Temp: <span class="metric-val">${n.temp ? n.temp + '°C' : 'N/A'}</span></span>
                        </div>
                    </div>
                `;
                optionsHtml += `<option value="${n.node_id}">${n.node_id}</option>`;
            });

            listEl.innerHTML = listHtml;
            selectEl.innerHTML = optionsHtml;
        }

        function selectNode(nodeId) {
            selectedNodeId = nodeId;
            document.getElementById('selected-node-title').innerText = `Real-Time Telemetry: ${nodeId}`;
            renderNodeList();
            refreshChartForNode();
        }

        function refreshChartForNode() {
            if (!selectedNodeId || !timeSeriesStore[selectedNodeId]) return;
            const series = timeSeriesStore[selectedNodeId];

            chart.data.labels = series.map(s => s.timeLabel);
            chart.data.datasets[0].data = series.map(s => s.x);
            chart.data.datasets[1].data = series.map(s => s.y);
            chart.data.datasets[2].data = series.map(s => s.z);
            chart.data.datasets[3].data = series.map(s => s.mag);
            chart.update();
        }

        function pushTelemetryData(pt) {
            const nodeId = pt.node_id;
            const mag = Math.sqrt(pt.x*pt.x + pt.y*pt.y + pt.z*pt.z);
            const timeLabel = new Date(pt.timestamp || Date.now()).toLocaleTimeString();

            // Update Node State
            nodesData[nodeId] = {
                node_id: nodeId,
                x: pt.x,
                y: pt.y,
                z: pt.z,
                temp: pt.temp,
                vbat: pt.vbat,
                last_seen: pt.timestamp || new Date().toISOString()
            };

            if (!selectedNodeId) {
                selectNode(nodeId);
            }

            // Push to timeseries buffer
            if (!timeSeriesStore[nodeId]) {
                timeSeriesStore[nodeId] = [];
            }
            timeSeriesStore[nodeId].push({
                timeLabel: timeLabel,
                x: pt.x,
                y: pt.y,
                z: pt.z,
                mag: mag
            });

            if (timeSeriesStore[nodeId].length > maxDataPoints) {
                timeSeriesStore[nodeId].shift();
            }

            renderNodeList();

            if (selectedNodeId === nodeId) {
                refreshChartForNode();
            }
        }

        // Poll for initial node list and fallback data
        async function fetchInitialNodes() {
            try {
                const res = await fetch('/api/nodes');
                const nodes = await res.json();
                nodes.forEach(n => {
                    nodesData[n.node_id] = n;
                });
                if (nodes.length > 0 && !selectedNodeId) {
                    selectNode(nodes[0].node_id);
                }
                renderNodeList();
            } catch (err) {
                console.error("Failed to fetch nodes", err);
            }
        }

        // WebSocket Connection for Live Updates
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/live`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status-text').innerText = 'Connected Live (WS)';
                document.getElementById('net-status').style.borderColor = 'rgba(34, 197, 94, 0.4)';
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'telemetry') {
                    pushTelemetryData(msg);
                }
            };

            ws.onclose = () => {
                document.getElementById('status-text').innerText = 'Reconnecting...';
                document.getElementById('net-status').style.borderColor = 'rgba(239, 68, 68, 0.4)';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function downloadDataSubset() {
            const nodeId = document.getElementById('export-node-id').value;
            const fmt = document.getElementById('export-format').value;
            let url = `/api/data?format=${fmt}`;
            if (nodeId) url += `&node_id=${nodeId}`;
            window.open(url, '_blank');
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchInitialNodes();
            connectWebSocket();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetometer Network Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        main {
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            flex: 1;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .node-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 450px;
            overflow-y: auto;
        }

        .node-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .node-card:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .node-card.selected {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.12);
        }

        .node-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .node-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .node-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .node-metrics {
            display: flex;
            gap: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .metric-val {
            color: var(--text-main);
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            height: 380px;
            width: 100%;
        }

        .chart-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        select, input, button {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        button {
            background: linear-gradient(135deg, var(--accent-blue), #0284c7);
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .download-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <div class="logo-icon">M</div>
            <h1>Magnetometer Regional Network</h1>
        </div>
        <div class="status-badge" id="net-status">
            <div class="pulse-dot"></div>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <main>
        <div class="dashboard-grid">
            <!-- Left Side: Node List -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">Active Nodes</span>
                    <span id="node-count" style="font-size: 0.8rem; color: var(--text-muted);">0 nodes</span>
                </div>
                <div class="node-list" id="node-list">
                    <div style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 2rem 0;">
                        Waiting for incoming nodes...
                    </div>
                </div>
            </div>

            <!-- Right Side: Live & Historical Timeseries Chart -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title" id="selected-node-title">Telemetry Viewer</span>
                    <div class="chart-controls">
                        <!-- Time Range Selector -->
                        <select id="time-range-selector" onchange="onTimeRangeChange()">
                            <option value="live">Live Stream (Real-Time)</option>
                            <option value="1h">Last 1 Hour (10s Avg)</option>
                            <option value="6h">Last 6 Hours (1m Avg)</option>
                            <option value="24h">Last 24 Hours (1m Avg)</option>
                            <option value="7d">Last 7 Days (1h Avg)</option>
                        </select>
                        <!-- Field Component & Multi-Node Overlay Selector -->
                        <select id="field-selector" onchange="updateChartSeries()">
                            <optgroup label="Single Node View">
                                <option value="all">3-Axis Vectors (X, Y, Z)</option>
                                <option value="mag">Total Magnitude (|B|)</option>
                                <option value="rssi">Signal Strength (RSSI dBm)</option>
                                <option value="x">X Axis Only</option>
                                <option value="y">Y Axis Only</option>
                                <option value="z">Z Axis Only</option>
                            </optgroup>
                            <optgroup label="Multi-Node Overlay Comparison">
                                <option value="overlay_mag">Overlay: All Nodes (|B| Magnitude)</option>
                                <option value="overlay_bz">Overlay: All Nodes (Bz Field)</option>
                                <option value="overlay_rssi">Overlay: All Nodes (RSSI Signal)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="realtimeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Bottom Panel: Export / Download Data Subset -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Data Subset Exporter</span>
            </div>
            <div class="download-panel">
                <div class="form-group">
                    <label>Node ID</label>
                    <select id="export-node-id"></select>
                </div>
                <div class="form-group">
                    <label>Format</label>
                    <select id="export-format">
                        <option value="csv">CSV File (.csv)</option>
                        <option value="json">JSON Array (.json)</option>
                        <option value="parquet">Apache Parquet (.parquet)</option>
                        <option value="npz">NumPy Compressed Archive (.npz)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Averaging (Averaging Window)</label>
                    <select id="export-downsample">
                        <option value="0">Raw 1 Hz Samples</option>
                        <option value="10">10-Second Averaging</option>
                        <option value="60">1-Minute Averaging</option>
                        <option value="3600">1-Hour Averaging</option>
                    </select>
                </div>
                <div class="form-group" style="align-self: flex-end;">
                    <button onclick="downloadDataSubset()">Download Subset</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const isFileProtocol = window.location.protocol === 'file:';
        const apiHost = isFileProtocol ? 'localhost:8000' : window.location.host;
        const apiBaseUrl = `http://${apiHost}`;
        const wsBaseUrl = `ws://${apiHost}`;

        let nodesData = {};
        let selectedNodeId = null;
        let chart = null;
        const maxDataPoints = 60;

        let timeSeriesStore = {}; // Stores nT points: { nodeId: [{timeLabel, x, y, z, rssi}, ...] }
        let historicalStore = {}; // Historical store: { nodeId: [{timeLabel, x, y, z, rssi}, ...] }

        const NODE_COLORS = [
            '#38bdf8', '#a855f7', '#22c55e', '#ef4444', '#f59e0b',
            '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16'
        ];

        function initChart() {
            const ctx = document.getElementById('realtimeChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Bx (nT)', borderColor: '#38bdf8', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                        { label: 'By (nT)', borderColor: '#a855f7', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                        { label: 'Bz (nT)', borderColor: '#22c55e', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                        { label: 'Magnitude (nT)', borderColor: '#ef4444', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [], hidden: true },
                        { label: 'RSSI (dBm)', borderColor: '#f59e0b', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [], hidden: true }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#94a3b8', font: { family: 'Inter', size: 10 } }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#f8fafc', font: { family: 'Inter', size: 11 } }
                        }
                    }
                }
            });
        }

        async function onTimeRangeChange() {
            const range = document.getElementById('time-range-selector').value;
            if (range === 'live') {
                document.getElementById('selected-node-title').innerText = selectedNodeId ? `Real-Time Telemetry: ${selectedNodeId}` : 'Telemetry Viewer';
                refreshChartForNode();
                return;
            }

            // Calculate start time ISO string
            const now = new Date();
            let startTime = new Date();
            let downsampleSec = 0;

            if (range === '1h') { startTime.setHours(now.getHours() - 1); downsampleSec = 10; }
            else if (range === '6h') { startTime.setHours(now.getHours() - 6); downsampleSec = 60; }
            else if (range === '24h') { startTime.setHours(now.getHours() - 24); downsampleSec = 60; }
            else if (range === '7d') { startTime.setDate(now.getDate() - 7); downsampleSec = 3600; }

            const mode = document.getElementById('field-selector').value;
            if (mode.startsWith('overlay_')) {
                await fetchHistoricalAllNodes(startTime.toISOString(), downsampleSec);
            } else if (selectedNodeId) {
                await fetchHistoricalSingleNode(selectedNodeId, startTime.toISOString(), downsampleSec);
            }
        }

        async function fetchHistoricalSingleNode(nodeId, startIso, downsampleSec) {
            try {
                let url = `${apiBaseUrl}/api/v1/data?node_id=${nodeId}&format=json`;
                if (startIso) url += `&start=${encodeURIComponent(startIso)}`;
                if (downsampleSec > 0) url += `&downsample_sec=${downsampleSec}`;

                const res = await fetch(url);
                const body = await res.json();
                const rows = Array.isArray(body) ? body : (body.data || []);

                historicalStore[nodeId] = rows.map(r => {
                    const ts_str = r.timestamp_utc || r.timestamp;
                    const d = ts_str ? new Date(ts_str) : new Date();
                    const timeLabel = isNaN(d.getTime()) ? 'N/A' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    return {
                        timeLabel,
                        x: r.x_nT !== undefined ? r.x_nT : r.x,
                        y: r.y_nT !== undefined ? r.y_nT : r.y,
                        z: r.z_nT !== undefined ? r.z_nT : r.z,
                        rssi: r.rssi_dbm !== undefined ? r.rssi_dbm : r.rssi
                    };
                });

                document.getElementById('selected-node-title').innerText = `Historical (${document.getElementById('time-range-selector').value.toUpperCase()}): ${nodeId}`;
                refreshChartForNode();
            } catch (err) {
                console.error(`Failed to fetch historical data for ${nodeId}`, err);
            }
        }

        async function fetchHistoricalAllNodes(startIso, downsampleSec) {
            const nodes = Object.keys(nodesData);
            for (const nid of nodes) {
                let url = `${apiBaseUrl}/api/v1/data?node_id=${nid}&format=json`;
                if (startIso) url += `&start=${encodeURIComponent(startIso)}`;
                if (downsampleSec > 0) url += `&downsample_sec=${downsampleSec}`;
                try {
                    const res = await fetch(url);
                    const body = await res.json();
                    const rows = Array.isArray(body) ? body : (body.data || []);
                    historicalStore[nid] = rows.map(r => {
                        const ts_str = r.timestamp_utc || r.timestamp;
                        const d = ts_str ? new Date(ts_str) : new Date();
                        const timeLabel = isNaN(d.getTime()) ? 'N/A' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        return {
                            timeLabel,
                            x: r.x_nT !== undefined ? r.x_nT : r.x,
                            y: r.y_nT !== undefined ? r.y_nT : r.y,
                            z: r.z_nT !== undefined ? r.z_nT : r.z,
                            rssi: r.rssi_dbm !== undefined ? r.rssi_dbm : r.rssi
                        };
                    });
                } catch (e) {
                    console.error(e);
                }
            }
            updateChartSeries();
        }

        function updateChartSeries() {
            const mode = document.getElementById('field-selector').value;
            const timeRange = document.getElementById('time-range-selector').value;

            if (mode.startsWith('overlay_')) {
                // Multi-Node Overlay Mode
                document.getElementById('selected-node-title').innerText = `Multi-Node Overlay Comparison (${mode.replace('overlay_', '').toUpperCase()})`;
                
                const activeNodes = Object.keys(nodesData);
                const isHistorical = timeRange !== 'live';
                const storeToUse = isHistorical ? historicalStore : timeSeriesStore;

                // Build union of labels
                let maxLabels = [];
                activeNodes.forEach(nid => {
                    const pts = storeToUse[nid] || [];
                    if (pts.length > maxLabels.length) {
                        maxLabels = pts.map(p => p.timeLabel);
                    }
                });

                chart.data.labels = maxLabels;
                chart.data.datasets = activeNodes.map((nid, idx) => {
                    const color = NODE_COLORS[idx % NODE_COLORS.length];
                    const pts = storeToUse[nid] || [];
                    let datasetData = [];

                    if (mode === 'overlay_mag') {
                        datasetData = pts.map(s => Math.sqrt(s.x*s.x + s.y*s.y + s.z*s.z));
                    } else if (mode === 'overlay_bz') {
                        datasetData = pts.map(s => s.z);
                    } else if (mode === 'overlay_rssi') {
                        datasetData = pts.map(s => s.rssi !== undefined && s.rssi !== null ? s.rssi : null);
                    }

                    return {
                        label: `${nid} (${mode.replace('overlay_', '').toUpperCase()})`,
                        borderColor: color,
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        pointRadius: 2,
                        data: datasetData,
                        hidden: false
                    };
                });
                chart.update();
                return;
            }

            // Single Node Standard Mode: restore default 5 datasets if replaced by overlay
            if (chart.data.datasets.length !== 5 || !chart.data.datasets[0].label.startsWith('Bx')) {
                chart.data.datasets = [
                    { label: 'Bx (nT)', borderColor: '#38bdf8', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                    { label: 'By (nT)', borderColor: '#a855f7', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                    { label: 'Bz (nT)', borderColor: '#22c55e', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [] },
                    { label: 'Magnitude (nT)', borderColor: '#ef4444', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [], hidden: true },
                    { label: 'RSSI (dBm)', borderColor: '#f59e0b', backgroundColor: 'transparent', borderWidth: 2, pointRadius: 2, data: [], hidden: true }
                ];
            }

            chart.data.datasets[0].hidden = (mode !== 'all' && mode !== 'x');
            chart.data.datasets[1].hidden = (mode !== 'all' && mode !== 'y');
            chart.data.datasets[2].hidden = (mode !== 'all' && mode !== 'z');
            chart.data.datasets[3].hidden = (mode !== 'mag');
            chart.data.datasets[4].hidden = (mode !== 'rssi');
            
            refreshChartForNode();
        }

        function renderNodeList() {
            const listEl = document.getElementById('node-list');
            const selectEl = document.getElementById('export-node-id');

            const nodes = Object.values(nodesData);
            document.getElementById('node-count').innerText = `${nodes.length} nodes registered`;
            
            if (nodes.length === 0) return;

            let listHtml = '';
            let optionsHtml = '<option value="">All Nodes</option>';

            nodes.forEach(n => {
                const isSel = n.node_id === selectedNodeId ? 'selected' : '';
                const bx = n.x !== undefined ? n.x : 0;
                const by = n.y !== undefined ? n.y : 0;
                const bz = n.z !== undefined ? n.z : 0;
                const mag = Math.sqrt(bx*bx + by*by + bz*bz).toFixed(1);
                
                let timeStr = 'N/A';
                if (n.last_seen) {
                    const d = new Date(n.last_seen);
                    timeStr = isNaN(d.getTime()) ? n.last_seen : d.toLocaleTimeString();
                }

                listHtml += `
                    <div class="node-card ${isSel}" onclick="selectNode('${n.node_id}')">
                        <div class="node-card-top">
                            <span class="node-name">${n.node_id}</span>
                            <span class="node-time">${timeStr}</span>
                        </div>
                        <div class="node-metrics">
                            <span>|B|: <span class="metric-val">${mag} nT</span></span>
                            <span>RSSI: <span class="metric-val">${n.rssi !== undefined && n.rssi !== null ? n.rssi + ' dBm' : 'N/A'}</span></span>
                        </div>
                    </div>
                `;
                optionsHtml += `<option value="${n.node_id}">${n.node_id}</option>`;
            });

            listEl.innerHTML = listHtml;
            selectEl.innerHTML = optionsHtml;
        }

        async function selectNode(nodeId) {
            selectedNodeId = nodeId;
            const mode = document.getElementById('field-selector').value;
            if (!mode.startsWith('overlay_')) {
                document.getElementById('selected-node-title').innerText = `Telemetry Viewer: ${nodeId}`;
            }
            renderNodeList();

            const range = document.getElementById('time-range-selector').value;
            if (range !== 'live') {
                await onTimeRangeChange();
            } else if (!timeSeriesStore[nodeId]) {
                await fetchHistoryForNode(nodeId);
            } else {
                refreshChartForNode();
            }
        }

        async function fetchHistoryForNode(nodeId) {
            try {
                const res = await fetch(`${apiBaseUrl}/api/v1/data?node_id=${nodeId}&format=json`);
                const body = await res.json();
                const rows = Array.isArray(body) ? body : (body.data || []);
                
                if (Array.isArray(rows) && rows.length > 0) {
                    const recent = rows.slice(-maxDataPoints);
                    const loaded = recent.map(r => {
                        const ts_str = r.timestamp_utc || r.timestamp;
                        const d = ts_str ? new Date(ts_str) : new Date();
                        const timeLabel = isNaN(d.getTime()) ? 'N/A' : d.toLocaleTimeString();
                        const x = r.x_nT !== undefined ? r.x_nT : r.x;
                        const y = r.y_nT !== undefined ? r.y_nT : r.y;
                        const z = r.z_nT !== undefined ? r.z_nT : r.z;
                        const rssi = r.rssi_dbm !== undefined ? r.rssi_dbm : r.rssi;
                        return { timeLabel, x, y, z, rssi };
                    });
                    if (!timeSeriesStore[nodeId] || timeSeriesStore[nodeId].length < loaded.length) {
                        timeSeriesStore[nodeId] = loaded;
                    }
                } else if (!timeSeriesStore[nodeId]) {
                    timeSeriesStore[nodeId] = [];
                }
            } catch (err) {
                console.error(`Failed to fetch history for ${nodeId}`, err);
                if (!timeSeriesStore[nodeId]) timeSeriesStore[nodeId] = [];
            }
            refreshChartForNode();
        }

        function refreshChartForNode() {
            const mode = document.getElementById('field-selector').value;
            if (mode.startsWith('overlay_')) return;

            const range = document.getElementById('time-range-selector').value;
            const isHistorical = range !== 'live';

            if (!selectedNodeId) return;
            const storeToUse = isHistorical ? historicalStore : timeSeriesStore;
            const series = storeToUse[selectedNodeId] || [];

            if (chart.data.datasets.length === 5 && chart.data.datasets[0].label.startsWith('Bx')) {
                chart.data.labels = series.map(s => s.timeLabel);
                chart.data.datasets[0].data = series.map(s => s.x);
                chart.data.datasets[1].data = series.map(s => s.y);
                chart.data.datasets[2].data = series.map(s => s.z);
                chart.data.datasets[3].data = series.map(s => Math.sqrt(s.x*s.x + s.y*s.y + s.z*s.z));
                chart.data.datasets[4].data = series.map(s => s.rssi !== undefined && s.rssi !== null ? s.rssi : null);

                chart.data.datasets[0].hidden = (mode !== 'all' && mode !== 'x');
                chart.data.datasets[1].hidden = (mode !== 'all' && mode !== 'y');
                chart.data.datasets[2].hidden = (mode !== 'all' && mode !== 'z');
                chart.data.datasets[3].hidden = (mode !== 'mag');
                chart.data.datasets[4].hidden = (mode !== 'rssi');
                chart.update();
            }
        }

        function pushTelemetryData(pt) {
            const nodeId = pt.node_id;
            const d = pt.timestamp ? new Date(pt.timestamp) : new Date();
            const timeLabel = isNaN(d.getTime()) ? new Date().toLocaleTimeString() : d.toLocaleTimeString();

            nodesData[nodeId] = {
                node_id: nodeId,
                x: pt.x,
                y: pt.y,
                z: pt.z,
                temp: pt.temp,
                vbat: pt.vbat,
                rssi: pt.rssi,
                last_seen: pt.timestamp || new Date().toISOString()
            };

            if (!timeSeriesStore[nodeId]) {
                timeSeriesStore[nodeId] = [];
            }
            timeSeriesStore[nodeId].push({
                timeLabel: timeLabel,
                x: pt.x,
                y: pt.y,
                z: pt.z,
                rssi: pt.rssi
            });

            if (timeSeriesStore[nodeId].length > maxDataPoints) {
                timeSeriesStore[nodeId].shift();
            }

            if (!selectedNodeId) {
                selectNode(nodeId);
            } else {
                renderNodeList();
                if (selectedNodeId === nodeId) {
                    refreshChartForNode();
                }
            }
        }

        async function fetchInitialNodes() {
            try {
                const res = await fetch(`${apiBaseUrl}/api/v1/nodes`);
                const nodes = await res.json();
                nodes.forEach(n => {
                    nodesData[n.node_id] = n;
                });
                renderNodeList();
                
                if (nodes.length > 0 && !selectedNodeId) {
                    selectNode(nodes[0].node_id);
                }
            } catch (err) {
                console.error("Failed to fetch nodes", err);
            }
        }

        function connectWebSocket() {
            const wsUrl = `${wsBaseUrl}/ws/live`;
            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('status-text').innerText = 'Connected Live';
                document.getElementById('net-status').style.borderColor = 'rgba(34, 197, 94, 0.4)';
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'telemetry') {
                        pushTelemetryData(msg);
                    }
                } catch (err) {
                    console.error("Error handling WS message:", err);
                }
            };

            ws.onclose = () => {
                document.getElementById('status-text').innerText = 'Reconnecting...';
                document.getElementById('net-status').style.borderColor = 'rgba(239, 68, 68, 0.4)';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function downloadDataSubset() {
            const nodeId = document.getElementById('export-node-id').value;
            const fmt = document.getElementById('export-format').value;
            const downsampleSec = document.getElementById('export-downsample').value;

            let url = `${apiBaseUrl}/api/v1/data?format=${fmt}`;
            if (nodeId) url += `&node_id=${nodeId}`;
            if (parseInt(downsampleSec) > 0) url += `&downsample_sec=${downsampleSec}`;
            window.open(url, '_blank');
        }

        setInterval(async () => {
            await fetchInitialNodes();
        }, 3000);

        window.addEventListener('DOMContentLoaded', () => {
            initChart();
            fetchInitialNodes();
            connectWebSocket();
        });
    </script>
</body>
</html>

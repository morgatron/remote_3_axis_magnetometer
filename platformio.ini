; PlatformIO Project Configuration File
; Remote 3-Axis Magnetometer & Multi-Protocol Gateway Firmware

[env]
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
upload_flags =
	--after
	hard_reset
board_build.partitions = min_spiffs.csv
build_flags =
	-I include
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CONFIG_BT_NIMBLE_EXT_ADV=1
lib_deps =
	h2zero/NimBLE-Arduino@^2.2.0
	jgromes/RadioLib@^7.0.0

; ------------------------------------------------------------------------------
; 1. ESP32-C3 RISC-V Target Environments
; ------------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c3-devkitm-1
build_src_filter = +<*> -<receiver/*> -<power_test/*> -<ble_serial_bridge/*>

[env:esp32c3_receiver]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c3-devkitm-1
build_src_filter = +<receiver/*>
build_flags =
	-I include
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D CONFIG_BT_NIMBLE_EXT_ADV=1

[env:esp32c3_ble_bridge]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c3-devkitm-1
build_src_filter = +<ble_serial_bridge/*>

; ------------------------------------------------------------------------------
; 2. ESP32-C6 High-Performance Wi-Fi 6 & 802.15.4 Target Environments
; ------------------------------------------------------------------------------
[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
build_src_filter = +<*> -<receiver/*> -<power_test/*> -<ble_serial_bridge/*>
framework = arduino
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
upload_flags =
	--after
	hard_reset
board_build.partitions = min_spiffs.csv
build_flags =
	-I include
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CONFIG_BT_NIMBLE_EXT_ADV=1
lib_deps =
	h2zero/NimBLE-Arduino@^2.2.0
	jgromes/RadioLib@^7.0.0

[env:esp32c6_receiver]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
build_src_filter = +<receiver/*>

[env:esp32c6_power_test]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
build_src_filter = +<power_test/*>

; ------------------------------------------------------------------------------
; 3. Heltec WiFi LoRa 32 V3 / V4 (ESP32-S3 + SX1262 LoRa) Target Environments
; ------------------------------------------------------------------------------
[env:heltec_v4_sensor]
platform = espressif32
board = heltec_wifi_lora_32_V3
build_src_filter = +<*> -<receiver/*> -<power_test/*> -<ble_serial_bridge/*>
build_flags =
	${env.build_flags}
	-D HELTEC_V4

[env:heltec_v4_receiver]
platform = espressif32
board = heltec_wifi_lora_32_V3
build_src_filter = +<receiver/*>
build_flags =
	${env.build_flags}
	-D HELTEC_V4

; ------------------------------------------------------------------------------
; 4. Legacy ESP32-WROOM Targets [DEPRECATED]
; ------------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
build_src_filter = +<*> -<receiver/*> -<ble_serial_bridge/*>

[env:esp32dev_receiver]
platform = espressif32
board = esp32dev
build_src_filter = +<receiver/*>

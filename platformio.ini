; ------------------------------------------------------------------------------
; 4. Legacy ESP32-WROOM Targets [DEPRECATED]
; ------------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
build_src_filter = +<*> -<receiver/*>
build_flags =
	-D CORE_DEBUG_LEVEL=0
lib_deps =
	h2zero/NimBLE-Arduino@^1.4.1

